gui:
  # icons in file/branch/commit views (needs a nerd font)
  nerdFontsVersion: "3"

  # catppuccin macchiato (blue accent), from catppuccin/lazygit
  theme:
    activeBorderColor:
      - "#8aadf4"
      - bold
    inactiveBorderColor:
      - "#a5adcb"
    searchingActiveBorderColor:
      - "#eed49f"
    optionsTextColor:
      - "#8aadf4"
    selectedLineBgColor:
      - "#363a4f"
    inactiveViewSelectedLineBgColor:
      - "#6e738d"
    cherryPickedCommitFgColor:
      - "#8aadf4"
    cherryPickedCommitBgColor:
      - "#494d64"
    markedBaseCommitFgColor:
      - "#8aadf4"
    markedBaseCommitBgColor:
      - "#eed49f"
    unstagedChangesColor:
      - "#ed8796"
    defaultFgColor:
      - "#cad3f5"
  authorColors:
    "*": "#b7bdf8"

git:
  pagers:
    - pager: delta --dark --paging=never --side-by-side --line-numbers

# return straight to lazygit after e.g. editing, no "press enter" step
promptToReturnFromSubprocess: false
